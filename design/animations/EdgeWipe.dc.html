<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #4fd6c9; } a:hover { color: #7ee6db; }
    /* the shape draws itself on: the stroke grows from nothing to full */
    .draw { stroke-dasharray: 1; animation: draw 6.0s ease-in-out infinite; }
    @keyframes draw {
      0% { stroke-dashoffset: 1; } 26% { stroke-dashoffset: 0; }
      90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; }
    }
    /* the vector field fades in behind the drawing wavefront */
    .arrow { animation: afade 6.0s ease-in-out infinite; }
    @keyframes afade {
      0% { opacity: 0; } 32% { opacity: 0; } 55% { opacity: .5; }
      90% { opacity: .5; } 100% { opacity: 0; }
    }
    /* after the shape is drawn, the camera eases OUT to frame the whole final image */
    .cam { transform-box: view-box; transform-origin: 340.0px 117.7px;
           animation: zoomout 6.0s ease-in-out infinite; }
    @keyframes zoomout {
      0% { transform: scale(1.14); } 26% { transform: scale(1.14); }
      52% { transform: scale(1); } 90% { transform: scale(1); } 100% { transform: scale(1.14); }
    }
  </style>
</helmet>
