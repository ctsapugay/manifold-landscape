<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manifold Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Three.js r160 vendored locally (web/vendor/) — no runtime CDN dependency. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <main id="stage">
    <div id="canvas-holder"></div>
    <div id="atmosphere"></div>

    <!-- wordmark -->
    <div id="wordmark">
      <span class="mark"></span>
      <span class="name">Manifold</span>
      <span id="brain-badge" class="badge-neutral">…</span>
    </div>

    <!-- top-right controls -->
    <div id="topbar">
      <button id="replay-btn" class="chip" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 3v5h5" /></svg>
        <span>Replay</span>
      </button>
      <button id="trace-toggle" class="chip" hidden aria-expanded="false">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M8 6h11" /><path d="M8 12h11" /><path d="M8 18h11" /><circle cx="3.5" cy="6" r="1.4" /><circle cx="3.5" cy="12" r="1.4" /><circle cx="3.5" cy="18" r="1.4" /></svg>
        <span>Tool calls</span>
      </button>
    </div>
    <div id="trace-panel" hidden></div>

    <!-- thinking indicator -->
    <div id="thinking" hidden><span class="spinner"></span> thinking&hellip;</div>

    <!-- vector-field toggle (bottom-left) -->
    <button id="field-toggle" class="chip" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 8h6M4 8l2-2M4 8l2 2" /><path d="M14 16h6M20 16l-2-2M20 16l-2 2" /></svg>
      <span>Vector field</span>
      <span id="field-switch" class="switch"><span class="knob"></span></span>
    </button>

    <!-- floating tutor card -->
    <div id="tutor-card" hidden>
      <div class="t-head">
        <span id="tutor-label" class="t-label">Tutor</span>
        <span class="t-rule"></span>
        <span id="tutor-verified" class="t-verified" hidden>
          <svg viewBox="0 0 24 24" width="11" height="11"><path d="M20 6L9 17l-5-5" /></svg> verified
        </span>
        <span id="model-derived" class="t-warn" hidden>model-derived</span>
      </div>
      <div id="tutor-text" class="t-text"></div>
      <div class="t-foot">
        <button id="tutor-prev" class="nav">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div id="tutor-dots" class="dots"></div>
        <button id="tutor-next" class="nav accent">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M9 18l6-6-6-6" /></svg>
        </button>
        <span class="grow"></span>
        <button id="results-toggle" class="t-link" aria-expanded="false">verified results</button>
        <span id="tutor-counter" class="t-counter"></span>
      </div>
    </div>

    <!-- verified results (collapsible) -->
    <div id="results-panel" hidden>
      <div class="r-head">Verified results <span class="r-hint">every value tool-computed and checked</span></div>
      <div id="quantities"></div>
    </div>

    <!-- chat bar -->
    <div id="chatbar">
      <svg class="spark" viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z" /></svg>
      <input id="chat-input" type="text" autocomplete="off"
        placeholder="Ask anything, or pose a problem — e.g. show me an example of chaos" />
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M7 11l5-5 5 5" /><path d="M12 6v13" /></svg>
      </button>
    </div>

    <div id="hud">drag to rotate · scroll to zoom · right-drag to pan</div>
    <div id="error" hidden></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
