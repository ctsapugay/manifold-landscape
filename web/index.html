<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manifold Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Three.js r160 vendored locally (web/vendor/) — no runtime CDN dependency. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <main id="stage">
    <div id="canvas-holder"></div>
    <div id="atmosphere"></div>

    <!-- wordmark + new chat -->
    <div id="wordmark">
      <span class="mark"></span>
      <span class="name">Manifold</span>
      <span id="brain-badge" class="badge-neutral">…</span>
      <button id="new-chat" class="chip" hidden>
        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 5v14M5 12h14" /></svg>
        <span>New chat</span>
      </button>
    </div>

    <!-- top-right controls -->
    <div id="topbar">
      <button id="trace-toggle" class="chip" hidden aria-expanded="false">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M8 6h11" /><path d="M8 12h11" /><path d="M8 18h11" /><circle cx="3.5" cy="6" r="1.4" /><circle cx="3.5" cy="12" r="1.4" /><circle cx="3.5" cy="18" r="1.4" /></svg>
        <span>Tool calls</span>
      </button>
      <!-- surface reveal toggle: grow-from-centre (default) ⇄ contours bloom -->
      <button id="contour-toggle" class="chip" hidden title="Switch between the surface and its contour lines">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5.2" /><circle cx="12" cy="12" r="1.6" /></svg>
        <span class="label">Contours</span>
        <span id="contour-switch" class="switch"><span class="knob"></span></span>
      </button>
    </div>
    <div id="trace-panel" hidden></div>

    <!-- thinking indicator -->
    <div id="thinking" hidden><span class="spinner"></span> thinking&hellip;</div>

    <!-- vector-field toggle (bottom-left) -->
    <button id="field-toggle" class="chip" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 8h6M4 8l2-2M4 8l2 2" /><path d="M14 16h6M20 16l-2-2M20 16l-2 2" /></svg>
      <span>Vector field</span>
      <span id="field-switch" class="switch"><span class="knob"></span></span>
    </button>

    <!-- expandable bounds control (bottom-right) — G20 -->
    <div id="bounds" hidden>
      <button id="bd-minus" class="bd" title="Shrink the domain">−</button>
      <span id="bd-label" class="bd-dom">bounds ×1</span>
      <button id="bd-plus" class="bd" title="Grow the domain">+</button>
      <button id="bd-expand" class="bd exp" title="Expand the domain">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3" /></svg>
        <span>expand</span>
      </button>
    </div>

    <!-- START STATE: a single centred launcher (G19) -->
    <div id="launcher">
      <div class="lc-mark">Manifold</div>
      <div class="lc-title">What should we explore?</div>
      <div class="lc-sub">Pose a problem — an equation, a word problem, or “show me an example of
        chaos.” Every value you see is tool-computed and verified.</div>
      <div class="lc-dock">
        <svg class="spark" viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z" /></svg>
        <input id="launch-input" type="text" autocomplete="off"
          placeholder="Ask anything, or pose a problem…" />
        <button id="launch-send" aria-label="Start">
          <svg viewBox="0 0 24 24" width="19" height="19"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
        </button>
      </div>
      <div id="launch-chips" class="lc-chips">
        <button class="ex" data-q="the Lorenz system">the Lorenz system</button>
        <button class="ex" data-q="minimize x^2 + 3y^2">minimize x² + 3y²</button>
        <button class="ex" data-q="eigenvalues of [[2,1],[1,2]]">eigenvalues of [[2,1],[1,2]]</button>
        <button class="ex" data-q="show me an example of chaos">show me chaos</button>
      </div>
      <div id="launch-note" class="lc-note" hidden></div>
    </div>

    <!-- SESSION: one conversation dock (explanation + chat, collapsible) — G16/G19 -->
    <div id="dock" hidden>
      <div class="d-head">
        <span class="dot"></span>
        <span class="d-title">Conversation</span>
        <span id="dock-sub" class="d-sub"></span>
        <button id="dock-collapse" class="iconbtn" title="Collapse" aria-label="Collapse conversation">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
      </div>
      <div id="suggestions" class="suggest"></div>
      <div id="thread" class="thread"></div>
      <div id="composer" class="composer">
        <svg class="spark" viewBox="0 0 24 24" width="16" height="16"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z" /></svg>
        <input id="chat-input" type="text" autocomplete="off" placeholder="Ask Claude about any step…" />
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
        </button>
      </div>
    </div>

    <!-- collapsed conversation handle (slim left-edge tab) -->
    <button id="dock-tab" hidden aria-label="Show conversation">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M9 18l6-6-6-6" /></svg>
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
      <span class="tab-label">Chat</span>
    </button>

    <div id="hud">drag to rotate · scroll to zoom · right-drag to pan</div>
    <div id="error" hidden></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
